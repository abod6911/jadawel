<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3CA95" />
      <stop offset="50%" stop-color="#E5A962" />
      <stop offset="100%" stop-color="#D48B38" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B24" />
      <stop offset="100%" stop-color="#090B0E" />
    </linearGradient>
  </defs>

  <!-- Container: Sleek Dark Squircle -->
  <rect width="100" height="100" rx="26" fill="url(#bg-grad)" stroke="#E5A962" stroke-width="2" stroke-opacity="0.25" />

  <!-- Minimalist Geometric Arabic 'Jeem' (ج) -->
  <!-- Top Horizontal Bar -->
  <path
    d="M 32 35 H 68"
    stroke="url(#gold-grad)"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- Graceful Downward Curve & Crescent -->
  <path
    d="M 68 35 C 50 48, 68 62, 68 70 C 68 81, 54 82, 38 78"
    stroke="url(#gold-grad)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Minimalist Accent Dot (Pearl of the Red Sea) -->
  <circle cx="48" cy="58" r="5" fill="#4E9F96" />
</svg>
